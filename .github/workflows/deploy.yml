# Manual release only: a push never reaches Lukas (tech design §14).
name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      pages-artifact: true
    secrets: inherit

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
